{{define "modals/clientsModal"}}
<a-modal
    id="client-modal"
    v-model="clientModal.visible"
    :title="clientModal.title"
    @ok="clientModal.ok"
    :confirm-loading="clientModal.confirmLoading"
    :closable="true"
    :mask-closable="false"
    :class="themeSwitcher.currentTheme"
    :ok-text="clientModal.okText"
    cancel-text='{{ i18n "close" }}'
>
    <template v-if="isEdit">
        <a-tag
            v-if="isExpiry || isTrafficExhausted"
            color="red"
            :style="{ marginBottom: '10px', display: 'block', textAlign: 'center' }"
            >Account is (Expired|Traffic Ended) And Disabled</a-tag
        >
    </template>
    {{template "form/client"}}
    <!-- The account being typed is one protocol's worth. This carries it into the
         combined form as the first slot, so selling the same person a second protocol
         is one click rather than a create, a second create and then remembering to put
         the two in a group by hand — which is the step that gets skipped, and skipping
         it means each account carries its own copy of the quota and the customer gets
         it twice over.

         Add only. On an edit the account already exists, and the honest way to give an
         existing person another account is the customer editor's own +, which knows
         how to attach it to the group they are already in. Hidden from a reseller for
         the same reason the toolbar button is: the combined route refuses them. -->
    <a-button
        v-if="!isEdit && !RESELLER.isReseller && canAddMore"
        type="dashed"
        icon="usergroup-add"
        block
        @click="clientModal.addAnotherAccount()"
        >{{ i18n "pages.client.addAnotherAccount" }}</a-button
    >
</a-modal>
<script>
    const clientModal = {
        visible: false,
        confirmLoading: false,
        title: "",
        okText: "",
        isEdit: false,
        dbInbound: new DBInbound(),
        inbound: new Inbound(),
        clients: [],
        clientStats: [],
        oldClientId: "",
        index: null,
        clientIps: null,
        ok() {
            if (clientModal.isEdit) {
                ObjectUtil.execute(
                    clientModal.confirm,
                    clientModalApp.client,
                    clientModal.dbInbound.id,
                    clientModal.oldClientId,
                );
            } else {
                ObjectUtil.execute(
                    clientModal.confirm,
                    clientModalApp.client,
                    clientModal.dbInbound.id,
                );
            }
        },
        show({
            title = "",
            okText = '{{ i18n "sure" }}',
            index = null,
            dbInbound = null,
            confirm = () => {},
            isEdit = false,
        }) {
            this.visible = true;
            this.title = title;
            this.okText = okText;
            this.isEdit = isEdit;
            this.dbInbound = new DBInbound(dbInbound);
            this.inbound = Inbound.fromJson(dbInbound.toInbound().toJson());
            this.clients = this.inbound.clients;
            this.index = index === null ? this.clients.length : index;
            if (isEdit) {
                // this.clients, not the bare `clients` this used to read: that was an
                // implicit global the inbounds page happened to leave behind on its way
                // here, so the modal only worked when opened from that one caller.
                this.oldClientId = this.getClientId(
                    dbInbound.protocol,
                    this.clients[index],
                );
            } else {
                this.addClient(this.inbound, this.clients);
                this.seedResellerQuota(this.clients[this.index]);
            }
            this.clientStats = this.dbInbound.clientStats.find(
                (row) => row.email === this.clients[this.index].email,
            );
            this.confirm = confirm;
        },
        // Single definition in model/inbound.js, mirrored by clientIdentityKey() in
        // web/service/inbound.go. Do not inline the switch here again.
        getClientId(protocol, client) {
            return getClientIdentity(protocol, client);
        },
        // A new account starts at totalGB 0, which means UNLIMITED, and a reseller
        // selling out of a limited balance may not create one of those. The form's
        // :min shows their floor but ant only clamps the MODEL on interaction, so an
        // untouched field left the quota at 0 while displaying 1: the save was
        // refused, and the derived duration beside it read 0 days because the days
        // are a function of the gigabytes.
        //
        // Seeding the model, rather than the input, is what makes the two agree.
        seedResellerQuota(client) {
            if (!client || !RESELLER.isReseller || RESELLER.unlimited) return;
            if (client.totalGB > 0) return;
            const floorGb = Math.max(1, Number(RESELLER.minCreateGb) || 0);
            client.totalGB = floorGb * SizeFormatter.ONE_GB;
        },
        // Single definition in model/inbound.js, for the same reason getClientId above
        // delegates: the combined form opens a slot on any inbound, so a protocol this
        // switch knew about and that one did not was a slot that created nothing.
        addClient(inbound, clients) {
            const client = createClientForInbound(inbound);
            if (!client) return null;
            return clients.push(client);
        },
        // Hands this half-typed account to the combined form and closes. Nothing is
        // created on the way: the account is still a draft, and it becomes the first
        // slot of a customer that the combined form creates in one transaction along
        // with whatever else is added to it.
        addAnotherAccount() {
            const seed = {
                dbInbound: clientModal.dbInbound,
                client: clientModalApp.client,
            };
            clientModal.close();
            app.openCombinedAccount(seed);
        },
        close() {
            clientModal.visible = false;
            clientModal.loading(false);
        },
        loading(loading = true) {
            clientModal.confirmLoading = loading;
        },
    };

    const clientModalApp = new Vue({
        delimiters: ["[[", "]]"],
        el: "#client-modal",
        data: {
            clientModal,
            get inbound() {
                return this.clientModal.inbound;
            },
            get client() {
                return this.clientModal.clients[this.clientModal.index];
            },
            get clientStats() {
                return this.clientModal.clientStats;
            },
            get isEdit() {
                return this.clientModal.isEdit;
            },
            get datepicker() {
                return app.datepicker;
            },
            // Whether this page can carry the account on into a customer. Both pages
            // that render this dialog define openCombinedAccount, and the clients page
            // withholds it from an operator who may not have groups at all.
            get canAddMore() {
                return typeof app.openCombinedAccount === "function";
            },
            get isTrafficExhausted() {
                if (!this.clientStats) return false;
                if (this.clientStats.total <= 0) return false;
                if (this.clientStats.up + this.clientStats.down < this.clientStats.total)
                    return false;
                return true;
            },
            get isExpiry() {
                return this.clientModal.isEdit && this.client.expiryTime > 0
                    ? this.client.expiryTime < new Date().getTime()
                    : false;
            },
        },
        // getDBClientIps / clearDBClientIps / resetClientTraffic and the delayed-start
        // and reseller-duration accessors moved into the a-client-form component with
        // the fields that use them: several of those forms can now be on screen at
        // once, and this instance could only ever have answered for one of them.
    });
</script>
{{end}}
