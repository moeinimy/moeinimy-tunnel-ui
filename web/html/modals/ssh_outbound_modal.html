{{define "modals/sshOutboundModal"}}
<a-modal id="ssh-outbound-modal" v-model="sshOutboundModal.visible" title="SSH Outbound"
         :closable="true" :footer="null" :width="680" :class="themeSwitcher.currentTheme">
    <!-- list of configured tunnels -->
    <template v-if="sshOutboundModal.mode === 'list'">
        <a-alert type="info" show-icon :style="{ marginBottom: '12px' }"
            message='{{ i18n "pages.xray.outbound.sshOutHint" }}'></a-alert>
        <a-list bordered v-if="sshOutboundModal.list.length">
            <a-list-item v-for="item in sshOutboundModal.list" :key="item.tag">
                <a-list-item-meta :title="item.tag"
                    :description="item.username + '@' + item.address + ':' + item.port + '   ·   SOCKS 127.0.0.1:' + item.socksPort">
                </a-list-item-meta>
                <a-space>
                    <a-button size="small" icon="edit" @click="editTunnel(item)"></a-button>
                    <a-button size="small" type="danger" icon="delete" @click="deleteTunnel(item)"></a-button>
                </a-space>
            </a-list-item>
        </a-list>
        <a-empty v-else :description="`{{ i18n "pages.xray.outbound.sshOutNone" }}`"></a-empty>
        <a-space :style="{ marginTop: '12px' }">
            <a-button type="primary" icon="plus" @click="newTunnel">{{ i18n "pages.xray.outbound.sshOutAdd" }}</a-button>
            <a-button @click="sshOutboundModal.hide()">{{ i18n "close" }}</a-button>
        </a-space>
    </template>
    <!-- add / edit form -->
    <template v-else>
        <a-form layout="vertical">
            <a-row :gutter="12">
                <a-col :span="12">
                    <a-form-item label='{{ i18n "pages.xray.outbound.sshOutTag" }}'>
                        <a-input v-model="sshOutboundForm.tag" :disabled="sshOutboundForm._edit" placeholder="ssh-out-1"></a-input>
                    </a-form-item>
                </a-col>
                <a-col :span="12">
                    <a-form-item label='{{ i18n "pages.xray.outbound.sshOutSocksPort" }}'>
                        <a-input-number v-model="sshOutboundForm.socksPort" :min="1" :max="65535" :style="{ width: '100%' }"></a-input-number>
                    </a-form-item>
                </a-col>
            </a-row>
            <a-row :gutter="12">
                <a-col :span="16">
                    <a-form-item label='{{ i18n "pages.xray.outbound.sshOutAddress" }}'>
                        <a-input v-model="sshOutboundForm.address" placeholder="203.0.113.10"></a-input>
                    </a-form-item>
                </a-col>
                <a-col :span="8">
                    <a-form-item label='{{ i18n "pages.xray.outbound.sshOutPort" }}'>
                        <a-input-number v-model="sshOutboundForm.port" :min="1" :max="65535" :style="{ width: '100%' }"></a-input-number>
                    </a-form-item>
                </a-col>
            </a-row>
            <a-form-item label='{{ i18n "pages.xray.outbound.sshOutUsername" }}'>
                <a-input v-model="sshOutboundForm.username" placeholder="root"></a-input>
            </a-form-item>
            <a-form-item label='{{ i18n "pages.xray.outbound.sshOutAuth" }}'>
                <a-radio-group v-model="sshOutboundForm.authType">
                    <a-radio value="password">{{ i18n "pages.xray.outbound.sshOutPassword" }}</a-radio>
                    <a-radio value="privateKey">{{ i18n "pages.xray.outbound.sshOutKey" }}</a-radio>
                </a-radio-group>
            </a-form-item>
            <a-form-item v-if="sshOutboundForm.authType === 'password'" label='{{ i18n "pages.xray.outbound.sshOutPassword" }}'>
                <a-input-password v-model="sshOutboundForm.password"
                    :placeholder="sshOutboundForm._edit ? '{{ i18n "pages.xray.outbound.sshOutKeep" }}' : ''"></a-input-password>
            </a-form-item>
            <template v-else>
                <a-form-item label='{{ i18n "pages.xray.outbound.sshOutKey" }}'>
                    <a-textarea v-model="sshOutboundForm.privateKey" :rows="4"
                        :placeholder="sshOutboundForm._edit ? '{{ i18n "pages.xray.outbound.sshOutKeep" }}' : '-----BEGIN OPENSSH PRIVATE KEY-----'"></a-textarea>
                </a-form-item>
                <a-form-item label='{{ i18n "pages.xray.outbound.sshOutPassphrase" }}'>
                    <a-input-password v-model="sshOutboundForm.passphrase"></a-input-password>
                </a-form-item>
            </template>
            <a-form-item label='{{ i18n "pages.xray.outbound.sshOutKnownHost" }}'>
                <a-input v-model="sshOutboundForm.knownHost" placeholder="SHA256:..."></a-input>
            </a-form-item>
            <a-space :style="{ display: 'flex', flexWrap: 'wrap', rowGap: '8px' }">
                <a-button type="primary" icon="save" :loading="sshOutboundModal.saving" @click="saveTunnel">{{ i18n "confirm" }}</a-button>
                <a-button @click="sshOutboundModal.mode = 'list'">{{ i18n "cancel" }}</a-button>
                <a-button v-if="sshOutboundForm._edit" icon="reload" @click="refreshStatus">{{ i18n "pages.xray.outbound.sshOutStatus" }}</a-button>
                <a-tag v-if="sshOutboundModal.statusText" :color="sshOutboundModal.statusUp ? 'green' : 'orange'">[[ sshOutboundModal.statusText ]]</a-tag>
            </a-space>
            <!-- live tunnel log (procLog ring buffer), shared core-setup terminal look -->
            <div v-if="sshOutboundModal.log" class="term" :style="{ marginTop: '10px' }">
                <div class="term-bar">
                    <a-icon type="code" class="term-bar-icon"></a-icon>
                    <span class="term-bar-title">[[ sshOutboundForm.tag ]]</span>
                </div>
                <div class="term-body" :style="{ maxHeight: '180px' }">
                    <div class="term-line" v-for="(l, i) in sshOutboundModal.log.split('\n')" :key="i">
                        <span class="term-name">[[ l || ' ' ]]</span>
                    </div>
                </div>
            </div>
        </a-form>
    </template>
</a-modal>
<script>
    const sshOutboundModal = {
        visible: false,
        mode: 'list',      // 'list' | 'form'
        list: [],
        saving: false,
        log: '',
        statusText: '',
        statusUp: false,
        show() {
            this.mode = 'list';
            this.log = '';
            this.statusText = '';
            this.visible = true;
            this.refresh();
        },
        hide() { this.visible = false; },
        async refresh() {
            const msg = await HttpUtil.post('/panel/xray/sshoutbound/list');
            if (msg && msg.success) this.list = msg.obj || [];
        },
    };
    const sshOutboundForm = {
        _edit: false, tag: '', remark: '', address: '', port: 22, username: '',
        authType: 'password', password: '', privateKey: '', passphrase: '', knownHost: '', socksPort: 10810,
    };

    new Vue({
        delimiters: ['[[', ']]'],
        el: '#ssh-outbound-modal',
        data: { sshOutboundModal, sshOutboundForm },
        methods: {
            newTunnel() {
                const n = sshOutboundModal.list.length;
                Object.assign(sshOutboundForm, {
                    _edit: false, tag: 'ssh-out-' + (n + 1), remark: '', address: '', port: 22, username: '',
                    authType: 'password', password: '', privateKey: '', passphrase: '', knownHost: '', socksPort: 10810 + n,
                });
                sshOutboundModal.log = '';
                sshOutboundModal.statusText = '';
                sshOutboundModal.mode = 'form';
            },
            editTunnel(item) {
                // Secrets are never sent back by the server; blank fields keep the stored ones.
                Object.assign(sshOutboundForm, {
                    _edit: true, tag: item.tag, remark: item.remark || '', address: item.address, port: item.port,
                    username: item.username, authType: item.authType || 'password',
                    password: '', privateKey: '', passphrase: '', knownHost: item.knownHost || '', socksPort: item.socksPort,
                });
                sshOutboundModal.log = '';
                sshOutboundModal.statusText = '';
                sshOutboundModal.mode = 'form';
                this.refreshStatus();
            },
            async saveTunnel() {
                sshOutboundModal.saving = true;
                const msg = await HttpUtil.post('/panel/xray/sshoutbound/save', sshOutboundForm);
                sshOutboundModal.saving = false;
                if (!msg || !msg.success) return;
                // Add/replace the tagged socks outbound in the template so routing/reverse can
                // target it, then remind the operator to Save the Xray config to persist it.
                this.addSshSocksOutbound(sshOutboundForm.tag, Number(sshOutboundForm.socksPort) || 10810);
                this.$message.success('{{ i18n "pages.xray.outbound.sshOutSaved" }}');
                await sshOutboundModal.refresh();
                sshOutboundModal.mode = 'list';
            },
            deleteTunnel(item) {
                const self = this;
                this.$confirm({
                    title: '{{ i18n "delete" }}', content: item.tag,
                    class: themeSwitcher.currentTheme, okText: '{{ i18n "delete" }}', cancelText: '{{ i18n "cancel" }}',
                    onOk: async () => {
                        const msg = await HttpUtil.post('/panel/xray/sshoutbound/delete', { tag: item.tag });
                        if (msg && msg.success) {
                            self.removeSshSocksOutbound(item.tag);
                            await sshOutboundModal.refresh();
                        }
                    },
                });
            },
            async refreshStatus() {
                const msg = await HttpUtil.post('/panel/xray/sshoutbound/status', { tag: sshOutboundForm.tag });
                if (msg && msg.obj) {
                    sshOutboundModal.statusUp = !!msg.obj.running;
                    sshOutboundModal.statusText = msg.obj.running
                        ? '{{ i18n "pages.xray.outbound.sshOutUp" }}'
                        : '{{ i18n "pages.xray.outbound.sshOutDown" }}';
                    sshOutboundModal.log = msg.obj.log || '';
                }
            },
            // Add/replace the tagged socks outbound that fronts this tunnel, then commit the
            // template. Reverse/routing select it purely by this tag. Mirrors WARP's addSocksOutbound.
            addSshSocksOutbound(tag, port) {
                const outs = app.templateSettings.outbounds;
                for (let i = outs.length - 1; i >= 0; i--) {
                    if (outs[i] && outs[i].tag === tag) outs.splice(i, 1);
                }
                outs.push({ tag: tag, protocol: 'socks', settings: { servers: [{ address: '127.0.0.1', port: port }] } });
                app.outboundSettings = JSON.stringify(outs);
            },
            removeSshSocksOutbound(tag) {
                const outs = app.templateSettings.outbounds;
                for (let i = outs.length - 1; i >= 0; i--) {
                    if (outs[i] && outs[i].tag === tag) outs.splice(i, 1);
                }
                app.outboundSettings = JSON.stringify(outs);
            },
        },
    });
</script>
{{end}}
