{{define "form/client"}}
<!-- The account form itself lives in component/aClientForm.html, because it is no
     longer this dialog's alone: every slot of a combined customer renders the same
     component, which is what makes "an account in a customer has the same options as
     an ordinary account" true by construction. This file is only the binding. -->
<a-client-form
    :client="client"
    :inbound="inbound"
    :is-edit="isEdit"
    :client-stats="clientStats || null"
    :datepicker="datepicker"
></a-client-form>
{{end}}
