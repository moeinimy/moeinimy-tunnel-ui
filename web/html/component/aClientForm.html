{{define "component/clientForm"}}
<a-form
    layout="horizontal"
    v-if="client"
    :colon="false"
    :label-col="{ md: {span:8} }"
    :wrapper-col="{ md: {span:14} }"
>
    <a-form-item v-if="showEnable" label='{{ i18n "pages.inbounds.enable" }}'>
        <a-switch v-model="client.enable"></a-switch>
    </a-form-item>
    <a-form-item>
        <template slot="label">
            <a-tooltip>
                <template slot="title">
                    <span>{{ i18n "pages.inbounds.emailDesc" }}</span>
                </template>
                {{ i18n "pages.inbounds.email" }}
                <a-icon
                    type="sync"
                    @click="setEmail(RandomUtil.randomLowerAndNum(9))"
                ></a-icon>
            </a-tooltip>
        </template>
        <!-- :value + @change rather than v-model: a slot of a combined account keeps
             deriving this from the customer's name until the operator types in it, and
             v-model gives the parent no way to tell those two apart. -->
        <a-input
            :value="client.email"
            @change="e => setEmail(e.target.value.trim())"
        ></a-input>
    </a-form-item>
    <a-form-item
        v-if="inbound.protocol === Protocols.L2TP || inbound.protocol === Protocols.PPTP || inbound.protocol === Protocols.OPENVPN || inbound.protocol === Protocols.OPENCONNECT || inbound.protocol === Protocols.SSTP || inbound.protocol === Protocols.SSH || (inbound.protocol === Protocols.IKEV2 && inbound.settings.authMode !== 'eap-tls' && inbound.settings.authMode !== 'psk')"
    >
        <template slot="label">
            <a-tooltip>
                <template slot="title">
                    <span>{{ i18n "reset" }}</span>
                </template>
                Username
                <a-icon
                    @click="client.id = RandomUtil.randomLowerAndNum(8)"
                    type="sync"
                ></a-icon>
            </a-tooltip>
        </template>
        <a-input v-model.trim="client.id"></a-input>
    </a-form-item>
    <!-- MTProto authenticates on a 32-hex secret, not a password: it is the whole
         credential and it is what the tg:// link carries. -->
    <a-form-item v-if="inbound.protocol === Protocols.MTPROTO">
        <template slot="label">
            <a-tooltip>
                <template slot="title">
                    <span>{{ i18n "reset" }}</span>
                </template>
                Secret
                <a-icon
                    @click="client.secret = RandomUtil.randomSeq(32, { type: 'hex' })"
                    type="sync"
                ></a-icon>
            </a-tooltip>
        </template>
        <a-input v-model.trim="client.secret"></a-input>
    </a-form-item>
    <a-form-item
        v-if="inbound.protocol === Protocols.TROJAN || inbound.protocol === Protocols.SHADOWSOCKS || inbound.protocol === Protocols.L2TP || inbound.protocol === Protocols.PPTP || inbound.protocol === Protocols.OPENVPN || inbound.protocol === Protocols.OPENCONNECT || inbound.protocol === Protocols.SSTP || inbound.protocol === Protocols.SSH || (inbound.protocol === Protocols.IKEV2 && inbound.settings.authMode !== 'eap-tls' && inbound.settings.authMode !== 'psk')"
    >
        <template slot="label">
            <a-tooltip>
                <template slot="title">
                    <span>{{ i18n "reset" }}</span>
                </template>
                {{ i18n "password" }}
                <a-icon
                    v-if="inbound.protocol === Protocols.SHADOWSOCKS"
                    @click="client.password = RandomUtil.randomShadowsocksPassword(inbound.settings.method)"
                    type="sync"
                ></a-icon>
                <a-icon
                    v-if="inbound.protocol === Protocols.TROJAN || inbound.protocol === Protocols.L2TP || inbound.protocol === Protocols.PPTP || inbound.protocol === Protocols.OPENVPN || inbound.protocol === Protocols.OPENCONNECT || inbound.protocol === Protocols.SSTP || inbound.protocol === Protocols.IKEV2 || inbound.protocol === Protocols.SSH"
                    @click="client.password = RandomUtil.randomSeq(10)"
                    type="sync"
                >
                </a-icon>
            </a-tooltip>
        </template>
        <a-input v-model.trim="client.password"></a-input>
    </a-form-item>
    <a-form-item v-if="inbound.protocol === Protocols.HYSTERIA">
        <template slot="label">
            <a-tooltip>
                <template slot="title">
                    <span>{{ i18n "reset" }}</span>
                </template>
                Auth Password
                <a-icon
                    @click="client.auth = RandomUtil.randomSeq(10)"
                    type="sync"
                ></a-icon>
            </a-tooltip>
        </template>
        <a-input v-model.trim="client.auth"></a-input>
    </a-form-item>
    <a-form-item
        v-if="inbound.protocol === Protocols.VMESS || inbound.protocol === Protocols.VLESS"
    >
        <template slot="label">
            <a-tooltip>
                <template slot="title">
                    <span>{{ i18n "reset" }}</span>
                </template>
                ID
                <a-icon
                    @click="client.id = RandomUtil.randomUUID()"
                    type="sync"
                ></a-icon>
            </a-tooltip>
        </template>
        <a-input v-model.trim="client.id"></a-input>
    </a-form-item>
    <a-form-item
        v-if="inbound.protocol === Protocols.VMESS"
        label='{{ i18n "security" }}'
    >
        <a-select
            v-model="client.security"
            :dropdown-class-name="themeSwitcher.currentTheme"
        >
            <a-select-option v-for="key in USERS_SECURITY" :key="key" :value="key"
                >[[ key ]]</a-select-option
            >
        </a-select>
    </a-form-item>
    <a-form-item v-if="showSubId && client.email && app.subSettings?.enable">
        <template slot="label">
            <a-tooltip>
                <template slot="title">
                    <span>{{ i18n "pages.inbounds.subscriptionDesc" }}</span>
                </template>
                Subscription
                <a-icon
                    @click="client.subId = RandomUtil.randomLowerAndNum(16)"
                    type="sync"
                ></a-icon>
            </a-tooltip>
        </template>
        <a-input v-model.trim="client.subId"></a-input>
    </a-form-item>
    <a-form-item v-if="showTgId && client.email && app.tgBotEnable">
        <template slot="label">
            <a-tooltip>
                <template slot="title">
                    <span>{{ i18n "pages.inbounds.telegramDesc" }}</span>
                </template>
                Telegram ChatID
                <a-icon type="question-circle"></a-icon>
            </a-tooltip>
        </template>
        <a-input-number
            :style="{ width: '50%' }"
            v-model.number="client.tgId"
            min="0"
        ></a-input-number>
    </a-form-item>
    <a-form-item v-if="showComment && client.email" label='{{ i18n "comment" }}'>
        <a-input v-model.trim="client.comment"></a-input>
    </a-form-item>
    <!-- An IP Limit is enforced by the patched core AT ADMISSION, and the core never
         sees a client of a VPN protocol (ipLimitEnforcedInCore excludes every one of
         them), so on those inbounds the field would publish to nothing and silently do
         nothing. What caps their devices is User Limit, below. -->
    <a-form-item v-if="app.ipLimitEnable && ipLimitApplies">
        <template slot="label">
            <a-tooltip>
                <template slot="title">
                    <span>{{ i18n "pages.inbounds.IPLimitDesc"}}</span>
                </template>
                <span>{{ i18n "pages.inbounds.IPLimit"}} </span>
                <a-icon type="question-circle"></a-icon>
            </a-tooltip>
        </template>
        <a-input-number
            v-model.number="client.limitIp"
            min="0"
        ></a-input-number>
    </a-form-item>
    <a-form-item v-if="inbound.protocol === Protocols.OPENVPN">
        <template slot="label">
            <a-tooltip>
                <template slot="title">
                    <span>
                        Max devices this account may have connected at once.
                        OpenVPN authenticates by username, so this counts
                        SESSIONS, not addresses — set it to 1 and only one person
                        can use the account, even if they share it. 0 inherits the
                        inbound's User Limit, which is also the ceiling.
                    </span>
                </template>
                <span>User Limit </span>
                <a-icon type="question-circle"></a-icon>
            </a-tooltip>
        </template>
        <a-input-number
            v-model.number="client.userLimit"
            :min="0"
            :max="64"
        ></a-input-number>
    </a-form-item>
    <a-form-item
        v-if="app.ipLimitEnable && ipLimitApplies && client.limitIp > 0 && client.email && isEdit"
    >
        <template slot="label">
            <a-tooltip>
                <template slot="title">
                    <span>{{ i18n "pages.inbounds.IPLimitlogDesc" }}</span>
                </template>
                <span>{{ i18n "pages.inbounds.IPLimitlog" }} </span>
                <a-icon type="question-circle"></a-icon>
            </a-tooltip>
        </template>
        <a-tooltip>
            <template slot="title">
                <span>{{ i18n "pages.inbounds.IPLimitlogclear" }}</span>
            </template>
            <span :style="{ color: '#FF4D4F' }">
                <a-icon
                    type="delete"
                    @click="clearDBClientIps(client.email)"
                ></a-icon>
            </span>
        </a-tooltip>
        <a-form layout="block">
            <!--
                A ref, not the id this used to carry. A page can now hold SEVERAL of
                these forms at once — one per account of a combined customer — and
                document.getElementById would have handed every one of them the first
                account's textarea, so reading IPs on the second account filled in the
                first account's box.
            -->
            <a-textarea
                ref="clientIps"
                readonly
                @click="getDBClientIps(client.email)"
                placeholder="Click To Get IPs"
                :auto-size="{ minRows: 5, maxRows: 10 }"
            >
            </a-textarea>
        </a-form>
    </a-form-item>
    <a-form-item v-if="inbound.canEnableTlsFlow()" label="Flow">
        <a-select
            v-model="client.flow"
            :dropdown-class-name="themeSwitcher.currentTheme"
        >
            <a-select-option value="" selected
                >{{ i18n "none" }}</a-select-option
            >
            <a-select-option v-for="key in TLS_FLOW_CONTROL" :key="key" :value="key"
                >[[ key ]]</a-select-option
            >
        </a-select>
    </a-form-item>
    <!-- The allowance: the quota, the clock and the renewal period. Hidden when a
         GROUP owns them (scope="group"), because enforceGroups writes all three onto
         every member on each traffic tick — a figure typed here would be a figure
         about to be overwritten, and the operator would have no way to know which of
         the two they were looking at. -->
    <template v-if="showAllowance">
        <a-form-item>
            <template slot="label">
                <a-tooltip>
                    <template slot="title">
                        <span v-if="!RESELLER.isReseller || RESELLER.unlimited">0 {{ i18n "pages.inbounds.meansNoLimit" }}</span>
                        <span v-else>{{ i18n "pages.resellers.minCreateGbDesc" }}</span>
                    </template>
                    {{ i18n "pages.inbounds.totalFlow" }}
                    <a-icon type="question-circle"></a-icon>
                </a-tooltip>
            </template>
            <!-- A reseller selling out of a limited balance may not create an
                 unlimited account, so their floor is their own minimum rather than
                 0. This is the message, not the control: ResellerService.Quote
                 refuses it again server-side. -->
            <a-input-number
                v-model.number="client._totalGB"
                :min="RESELLER.isReseller && !RESELLER.unlimited ? Math.max(1, RESELLER.minCreateGb) : 0"
            ></a-input-number>
        </a-form-item>
    </template>
    <a-form-item v-if="isEdit && clientStats" label='{{ i18n "usage" }}'>
        <a-tag
            :color="ColorUtils.clientUsageColor(clientStats, app.trafficDiff)"
        >
            [[ SizeFormatter.sizeFormat(clientStats.up) ]] / [[
            SizeFormatter.sizeFormat(clientStats.down) ]] ([[
            SizeFormatter.sizeFormat(clientStats.up + clientStats.down) ]])
        </a-tag>
        <a-tooltip v-if="showAllowance">
            <template slot="title"
                >{{ i18n "pages.inbounds.resetTraffic" }}</template
            >
            <!-- Shown to a reseller too, but it is not free for them: zeroing
                 the counters lets the account move those bytes again, so the
                 reset is CHARGED to their balance (ResellerService
                 PrepareClientReset). The route prices it and refuses when they
                 cannot afford it, naming the shortfall.

                 Absent for a member of a customer, where it would be a lie: the
                 shared usage is the SUM of the members' counters, so zeroing one
                 of them hands the customer back that much of their allowance
                 without the group having been renewed. -->
            <a-icon
                type="retweet"
                @click="resetClientTraffic(client.email, clientStats.inboundId, $event.target)"
                v-if="client.email.length > 0"
            ></a-icon>
        </a-tooltip>
    </a-form-item>
    <template v-if="showAllowance">
        <!-- Days-per-GB makes the duration a function of the traffic, so a reseller
             on that plan gets no expiry control at all: the backend overwrites
             whatever is posted (ResellerService.forcedExpiry). Showing the fields
             would only invite an edit that silently does nothing. -->
        <a-form-item v-if="resellerForcedDays" label='{{ i18n "pages.resellers.daysPerGb" }}'>
            <a-tag color="blue">[[ resellerForcedDaysText ]]</a-tag>
        </a-form-item>
        <a-form-item v-if="!resellerForcedDays" label='{{ i18n "pages.client.delayedStart" }}'>
            <a-switch
                v-model="delayed"
                @click="client._expiryTime=0"
            ></a-switch>
        </a-form-item>
        <a-form-item
            v-if="delayed && !resellerForcedDays"
            label='{{ i18n "pages.client.expireDays" }}'
        >
            <a-input-number
                v-model.number="delayedExpireDays"
                :min="0"
            ></a-input-number>
        </a-form-item>
        <a-form-item v-else-if="!resellerForcedDays">
            <template slot="label">
                <a-tooltip>
                    <template slot="title"
                        >{{ i18n "pages.inbounds.leaveBlankToNeverExpire"
                        }}</template
                    >
                    {{ i18n "pages.inbounds.expireDate" }}
                    <a-icon type="question-circle"></a-icon>
                </a-tooltip>
            </template>
            <a-date-picker
                v-if="datepicker == 'gregorian'"
                :show-time="{ format: 'HH:mm:ss' }"
                format="YYYY-MM-DD HH:mm:ss"
                :dropdown-class-name="themeSwitcher.currentTheme"
                v-model="client._expiryTime"
            ></a-date-picker>
            <a-persian-datepicker
                v-else
                placeholder='{{ i18n "pages.settings.datepickerPlaceholder" }}'
                value="client._expiryTime"
                v-model="client._expiryTime"
            ></a-persian-datepicker>
            <a-tag color="red" v-if="isEdit && isExpiry">Expired</a-tag>
        </a-form-item>
        <a-form-item v-if="client.expiryTime != 0">
            <template slot="label">
                <a-tooltip>
                    <template slot="title"
                        >{{ i18n "pages.client.renewDesc" }}</template
                    >
                    {{ i18n "pages.client.renew" }}
                    <a-icon type="question-circle"></a-icon>
                </a-tooltip>
            </template>
            <a-input-number v-model.number="client.reset" :min="0"></a-input-number>
        </a-form-item>
    </template>

    <!-- MTProto Proxy: per-account settings. These are per CLIENT, not per inbound,
         because the proxy keys them off the authenticated secret rather than the
         socket, so one inbound can serve accounts with different modes and links. -->
    <template v-if="inbound.protocol === Protocols.MTPROTO">
        <a-divider>MTProto Proxy</a-divider>

        <a-form-item>
            <template slot="label">
                <a-tooltip>
                    <template slot="title">
                        The original obfuscated transport (no secret prefix). Widely
                        supported but the easiest for DPI to fingerprint. Off means the
                        proxy refuses this account's plain secret.
                    </template>
                    Classic Mode
                    <a-icon type="question-circle"></a-icon>
                </a-tooltip>
            </template>
            <!--
                Guarded rather than v-model: an account with every mode off cannot be
                dialed by anything, so the backend drops it from the proxy config
                entirely. Refusing the last one here (instead of warning after the
                fact) keeps that state unreachable. See the sibling switches.
            -->
            <a-switch
                :checked="client.modeClassic"
                @change="v => v || client.modeSecure || client.modeTls
                    ? client.modeClassic = v
                    : $message.warning(MTPROTO_LAST_MODE_WARNING)"
            ></a-switch>
        </a-form-item>

        <a-form-item>
            <template slot="label">
                <a-tooltip>
                    <template slot="title">
                        Random-padding mode ("dd" secret prefix). Hides packet-length
                        patterns from DPI.
                    </template>
                    Secure Mode (dd)
                    <a-icon type="question-circle"></a-icon>
                </a-tooltip>
            </template>
            <a-switch
                :checked="client.modeSecure"
                @change="v => v || client.modeClassic || client.modeTls
                    ? client.modeSecure = v
                    : $message.warning(MTPROTO_LAST_MODE_WARNING)"
            ></a-switch>
        </a-form-item>

        <a-form-item>
            <template slot="label">
                <a-tooltip>
                    <template slot="title">
                        FakeTLS ("ee" secret prefix): traffic looks like an ordinary
                        HTTPS session to the domain below. The most censorship-resistant
                        mode.
                    </template>
                    FakeTLS Mode (ee)
                    <a-icon type="question-circle"></a-icon>
                </a-tooltip>
            </template>
            <a-switch
                :checked="client.modeTls"
                @change="v => v || client.modeClassic || client.modeSecure
                    ? client.modeTls = v
                    : $message.warning(MTPROTO_LAST_MODE_WARNING)"
            ></a-switch>
        </a-form-item>

        <a-form-item v-if="client.modeTls">
            <template slot="label">
                <a-tooltip>
                    <template slot="title">
                        The domain this account's FakeTLS link impersonates, encoded into
                        its ee secret. Pick a real, reachable HTTPS site that is plausible
                        for the user and not itself blocked. Changing it invalidates the
                        ee link already handed out.
                    </template>
                    FakeTLS Domain
                    <a-icon type="question-circle"></a-icon>
                </a-tooltip>
            </template>
            <a-input
                v-model.trim="client.tlsDomain"
                placeholder="www.google.com"
            ></a-input>
        </a-form-item>

        <a-form-item>
            <template slot="label">
                <a-tooltip>
                    <template slot="title">
                        Max simultaneous client IPs for this account, enforced by the
                        proxy itself (the excess connection is refused). 0 means no
                        limit. Named for what it counts: devices sharing one IP behind
                        NAT count as one, so this caps addresses, not devices.
                    </template>
                    IP Limit
                    <a-icon type="question-circle"></a-icon>
                </a-tooltip>
            </template>
            <a-input-number
                v-model.number="client.userLimit"
                :min="0"
                :max="64"
            ></a-input-number>
        </a-form-item>

        <a-form-item>
            <template slot="label">
                <a-tooltip>
                    <template slot="title">
                        Promote a sponsored channel for this account with a tag from
                        @MTProxybot. Read the warning before enabling: it turns Xray
                        routing off for every account on this inbound.
                    </template>
                    Ad Tag
                    <a-icon type="question-circle"></a-icon>
                </a-tooltip>
            </template>
            <a-switch v-model="client.adtagEnable"></a-switch>
        </a-form-item>

        <a-alert
            v-if="client.adtagEnable"
            type="warning"
            show-icon
            :style="{ marginBottom: '16px' }"
            message="Ad Tag turns off Xray routing for the WHOLE inbound"
            description="An ad tag only counts if traffic goes through Telegram's middle-proxy relays, and that path is a property of the proxy process, not of one account. So enabling it here also stops every OTHER account on this inbound from being routed through Xray: they all egress directly from this server instead. Telegram derives the middle-proxy key from this server's own outgoing IP and port, which any proxied egress would change. Everything else (usage, quota, IP Limit, per-account modes) works the same either way."
        ></a-alert>

        <a-form-item v-if="client.adtagEnable" label="Ad Tag">
            <a-input
                v-model.trim="client.adtag"
                placeholder="32 hex characters from @MTProxybot"
            ></a-input>
        </a-form-item>

        <a-form-item>
            <template slot="label">
                <a-tooltip>
                    <template slot="title">
                        Hand out links pointing at a relay/CDN host:port instead of this
                        server's own address. Affects this account's links only; the proxy
                        itself is unchanged.
                    </template>
                    External Proxy
                    <a-icon type="question-circle"></a-icon>
                </a-tooltip>
            </template>
            <a-switch
                :checked="Array.isArray(client.externalProxy) && client.externalProxy.length > 0"
                @change="v => client.externalProxy = v ? [{ dest: window.location.hostname, port: inbound.port, remark: '' }] : []"
            ></a-switch>
            <a-button
                icon="plus"
                v-if="Array.isArray(client.externalProxy) && client.externalProxy.length > 0"
                type="primary"
                size="small"
                :style="{ marginLeft: '10px' }"
                @click="client.externalProxy.push({ dest: '', port: inbound.port, remark: '' })"
            ></a-button>
        </a-form-item>

        <!--
            Rows sit OUTSIDE a-form-item on purpose: this form is label-col 8 /
            wrapper-col 14, so a labelled row would squeeze three controls into 14/24
            of the modal. Mirrors form/stream/external_proxy.html, including the minus
            button in addonAfter: a bare a-button is not a valid a-input-group compact
            child in antd-vue 1.7.8 and renders at the wrong height, unaligned.
        -->
        <a-input-group
            compact
            :style="{ margin: '8px 0' }"
            v-for="(row, index) in (client.externalProxy || [])"
            :key="index"
        >
            <a-input
                :style="{ width: '40%' }"
                v-model.trim="row.dest"
                placeholder='{{ i18n "host" }}'
            ></a-input>
            <a-tooltip title='{{ i18n "pages.inbounds.port" }}'>
                <a-input-number
                    :style="{ width: '20%' }"
                    v-model.number="row.port"
                    min="1"
                    max="65535"
                ></a-input-number>
            </a-tooltip>
            <a-input
                :style="{ width: '35%', top: '0' }"
                v-model.trim="row.remark"
                placeholder='{{ i18n "remark" }}'
            >
                <template slot="addonAfter">
                    <a-button
                        icon="minus"
                        size="small"
                        @click="client.externalProxy.splice(index, 1)"
                    ></a-button>
                </template>
            </a-input>
        </a-input-group>
    </template>
</a-form>
{{end}}

{{define "component/aClientForm"}}
<script>
    // THE account form. Every place the panel lets an operator describe one account
    // renders this: the ordinary Add/Edit Client dialog, and each slot of a combined
    // customer.
    //
    // It became a component when the combined form stopped being two fixed protocols
    // and started taking any number of slots on any inbound. Before that, the combined
    // form carried its own hand-written subset of these fields — a uuid, a username, a
    // flow — and every per-protocol setting it had not been told about was a setting a
    // combined customer simply could not be given: no MTProto mode, no FakeTLS domain,
    // no Hysteria auth, no VMess security, no external proxy. Reusing the real form is
    // what makes "the same options as an ordinary client" true by construction rather
    // than by being kept in step by hand.
    //
    // Globals it reads (as the template always has): app, themeSwitcher, RESELLER,
    // Protocols, RandomUtil, SizeFormatter, ColorUtils, TLS_FLOW_CONTROL,
    // USERS_SECURITY, MTPROTO_LAST_MODE_WARNING.
    Vue.component("a-client-form", {
        props: {
            // The account being edited, IN PLACE. The parent owns it; this form is a
            // view onto it, which is what lets a parent hold ten of them and post the
            // lot without collecting anything back.
            client: { type: Object, default: null },
            // An Inbound INSTANCE, not a DBInbound row: the template asks it for
            // canEnableTlsFlow(), its cipher and its IKEv2 auth mode.
            inbound: { type: Object, default: null },
            isEdit: { type: Boolean, default: false },
            clientStats: { type: Object, default: null },
            datepicker: { type: String, default: "gregorian" },
            // Rows this particular caller answers for itself, by name. Empty for the
            // ordinary dialog, where the account owns everything about itself.
            //
            //   allowance — the quota, the clock, the renewal period and the traffic
            //               reset. Hidden wherever a GROUP owns them: enforceGroups
            //               writes all of them onto every member on each traffic tick,
            //               so a figure typed here is a figure about to be overwritten.
            //   enable / comment / subId / tgId — hidden where the form asks for them
            //               ONCE for the whole customer, above the slots.
            hide: { type: Array, default: () => [] },
        },
        data() {
            return {
                // Local, not a prop: it is a way of LOOKING at expiryTime (negative
                // means the clock has not started), not a second piece of state. The
                // dialog that used to own it had one, which is another reason only one
                // account could be on screen at a time.
                delayed: !!(this.client && this.client.expiryTime < 0),
            };
        },
        watch: {
            // Reopening the dialog on a different account, or a combined slot whose
            // inbound was switched, hands the same component a new client. Without
            // this the switch would still show the previous account's answer.
            client(next) {
                this.delayed = !!(next && next.expiryTime < 0);
            },
        },
        computed: {
            showAllowance() {
                return !this.hide.includes("allowance");
            },
            showEnable() {
                return !this.hide.includes("enable");
            },
            showComment() {
                return !this.hide.includes("comment");
            },
            showSubId() {
                return !this.hide.includes("subId");
            },
            showTgId() {
                return !this.hide.includes("tgId");
            },
            // An IP Limit is published to the patched Xray core and checked at
            // admission. The core never sees a client of a VPN protocol, so on those
            // inbounds the field is not "unset", it is unenforceable — mirrors
            // ipLimitEnforcedInCore() in web/service/inbound.go. MTProto has its own
            // limit, on its own row, enforced by the proxy.
            ipLimitApplies() {
                if (!this.inbound) return false;
                return ![
                    Protocols.L2TP,
                    Protocols.PPTP,
                    Protocols.OPENVPN,
                    Protocols.OPENCONNECT,
                    Protocols.SSTP,
                    Protocols.IKEV2,
                    Protocols.WGC,
                    Protocols.AWG,
                    Protocols.MTPROTO,
                    Protocols.SSH,
                ].includes(this.inbound.protocol);
            },
            delayedExpireDays: {
                get() {
                    return this.client && this.client.expiryTime < 0
                        ? this.client.expiryTime / -86400000
                        : 0;
                },
                set(days) {
                    this.client.expiryTime = -86400000 * days;
                },
            },
            isExpiry() {
                return this.isEdit && this.client && this.client.expiryTime > 0
                    ? this.client.expiryTime < new Date().getTime()
                    : false;
            },
            // Whether this account's duration is a function of its traffic rather than
            // something the operator picks. True only for a reseller on a days-per-GB
            // plan, in which case the backend overwrites any posted expiry and the form
            // hides the controls entirely.
            resellerForcedDays() {
                return !!(RESELLER.isReseller && RESELLER.daysPerGb > 0);
            },
            resellerForcedDaysText() {
                const gb =
                    this.client && this.client.totalGB > 0
                        ? this.client.totalGB / SizeFormatter.ONE_GB
                        : 0;
                const days = NumberFormatter.toFixed(gb * RESELLER.daysPerGb, 1);
                return days + " " + '{{ i18n "pages.client.expireDays" }}';
            },
        },
        methods: {
            // Writes the email AND tells the parent it was a person who did it. A
            // combined slot keeps its email derived from the customer's name, and this
            // event is the only thing that distinguishes "the operator wants this exact
            // email" from "nobody has touched it yet".
            setEmail(value) {
                this.client.email = value;
                this.$emit("email-input", value);
            },
            // The textarea is found through the component's own ref, so several of
            // these forms on one page each fill in their own.
            ipsTextarea() {
                const ref = this.$refs.clientIps;
                if (!ref) return null;
                const el = ref.$el || ref;
                if (!el) return null;
                return el.tagName === "TEXTAREA" ? el : el.querySelector("textarea");
            },
            async getDBClientIps(email) {
                const box = this.ipsTextarea();
                if (!box) return;
                const msg = await HttpUtil.post(
                    `/panel/api/inbounds/clientIps/${email}`,
                );
                if (!msg.success) {
                    box.value = msg.obj;
                    return;
                }
                let ips = msg.obj;
                if (
                    typeof ips === "string" &&
                    ips.startsWith("[") &&
                    ips.endsWith("]")
                ) {
                    try {
                        ips = JSON.parse(ips);
                        ips = Array.isArray(ips) ? ips.join("\n") : ips;
                    } catch (e) {
                        console.error("Error parsing JSON:", e);
                    }
                }
                box.value = ips;
            },
            async clearDBClientIps(email) {
                try {
                    const msg = await HttpUtil.post(
                        `/panel/api/inbounds/clearClientIps/${email}`,
                    );
                    if (!msg.success) {
                        return;
                    }
                    const box = this.ipsTextarea();
                    if (box) box.value = "";
                } catch (error) {}
            },
            resetClientTraffic(email, dbInboundId, iconElement) {
                this.$confirm({
                    title: '{{ i18n "pages.inbounds.resetTraffic"}}',
                    content: '{{ i18n "pages.inbounds.resetTrafficContent"}}',
                    class: themeSwitcher.currentTheme,
                    okText: '{{ i18n "reset"}}',
                    cancelText: '{{ i18n "cancel"}}',
                    onOk: async () => {
                        iconElement.disabled = true;
                        const msg = await HttpUtil.postWithModal(
                            "/panel/api/inbounds/" +
                                dbInboundId +
                                "/resetClientTraffic/" +
                                email,
                        );
                        if (msg.success && this.clientStats) {
                            this.clientStats.up = 0;
                            this.clientStats.down = 0;
                        }
                        iconElement.disabled = false;
                    },
                });
            },
        },
        delimiters: ["[[", "]]"],
        template: `{{template "component/clientForm"}}`,
    });
</script>
{{end}}
