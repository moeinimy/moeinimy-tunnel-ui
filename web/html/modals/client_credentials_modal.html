{{define "modals/clientCredentialsModal"}}
<a-modal
    id="client-credentials-modal"
    v-model="credentialsModal.visible"
    :title="credentialsModal.title"
    :closable="true"
    :mask-closable="true"
    :class="themeSwitcher.currentTheme"
    :width="isMobile ? '96vw' : 720"
    :footer="null"
>
    <a-alert
        type="success"
        :show-icon="true"
        :class="themeSwitcher.currentTheme"
        :style="{ marginBottom: '14px' }"
        :message="credentialsModal.headline"
    ></a-alert>

    <div :style="{ marginBottom: '14px', display: 'flex', gap: '8px', flexWrap: 'wrap' }">
        <a-button type="primary" icon="copy" @click="credentialsModal.copyAll()">
            {{ i18n "pages.credentials.copyAll" }}
        </a-button>
        <a-button icon="download" @click="credentialsModal.download()">
            {{ i18n "pages.inbounds.exportTxt" }}
        </a-button>
    </div>

    <!-- One block per account. A combined customer gets several; an ordinary
         client gets one, and the layout is the same either way so there is only
         one thing to read. -->
    <div v-for="acc in credentialsModal.accounts" :key="acc.key"
        class="bo-cred" :style="{ marginBottom: '14px' }">
        <div class="bo-cred-head">
            <a-tag color="blue">[[ acc.protocol ]]</a-tag>
            <b>[[ acc.email ]]</b>
            <span class="bo-muted" v-if="acc.inboundRemark">— [[ acc.inboundRemark ]]</span>
        </div>

        <div v-for="field in acc.fields" :key="field.label" class="bo-cred-row">
            <div class="bo-cred-label">[[ field.label ]]</div>
            <div class="bo-cred-value">
                <span :class="field.mono ? 'bo-cred-mono' : ''">[[ field.value ]]</span>
            </div>
            <a-tooltip>
                <template slot="title">{{ i18n "copy" }}</template>
                <a-icon type="copy" class="bo-cred-copy"
                    @click="credentialsModal.copy(field.value)"></a-icon>
            </a-tooltip>
        </div>

        <!-- Links and subscription URLs are long, so they get their own full-width
             row rather than being squeezed into the label/value grid. -->
        <div v-for="link in acc.links" :key="link.label" class="bo-cred-link">
            <div class="bo-cred-label">
                [[ link.label ]]
                <a-icon type="copy" class="bo-cred-copy"
                    @click="credentialsModal.copy(link.value)"></a-icon>
            </div>
            <div class="bo-cred-linkbox" @click="credentialsModal.copy(link.value)">
                [[ link.value ]]
            </div>
        </div>

        <!-- Profiles that cannot be typed in by hand (.ovpn, .conf). Plain <a download>
             so the browser saves the file instead of routing it through the SPA. -->
        <div v-if="acc.files.length" class="bo-cred-files">
            <a v-for="f in acc.files" :key="f.url" class="bo-cred-file"
                :href="f.url" :download="f.filename">
                <a-icon type="download"></a-icon>&nbsp;[[ f.label ]]
            </a>
        </div>
    </div>
</a-modal>
<script>
    // Everything a customer needs in order to connect, gathered at the moment the
    // account is created.
    //
    // It exists because the alternative is a scavenger hunt: the OpenVPN username
    // lives in the client row, its password behind an edit dialog, the IPsec PSK on
    // the INBOUND rather than the account, the VLESS link behind a QR modal and the
    // subscription URL behind another. Nothing was wrong with any of them; there was
    // just no single place that answered "what do I send the customer".
    const credentialsModal = {
        visible: false,
        title: "",
        headline: "",
        accounts: [],

        // pairs is [{ dbInbound, client }]. dbInbound is passed rather than read off a
        // global so this works from the inbounds page and the clients page alike, and
        // may be a DBInbound or the raw server row.
        show({ title = "", headline = "", pairs = [] }) {
            this.title = title || '{{ i18n "pages.credentials.title" }}';
            this.headline = headline || '{{ i18n "pages.credentials.headline" }}';
            this.accounts = (pairs || [])
                .map((p) => this.describe(p.dbInbound, p.client))
                .filter(Boolean);
            this.visible = this.accounts.length > 0;
            return this.visible;
        },

        // The host the customer types into a "Server" field. The same value the
        // share links use (and the .ovpn download derives server-side), so a
        // customer who compares the two never sees them disagree.
        host(dbInbound) {
            const listen = dbInbound && dbInbound.listen;
            return listen && listen !== "0.0.0.0" && listen !== "::"
                ? listen
                : location.hostname;
        },

        describe(dbInbound, client) {
            if (!dbInbound || !client) return null;
            // Accepts either a DBInbound (what the pages hold) or the raw row from
            // /inbounds/list; toInbound() is what parses the settings JSON either way.
            const db = dbInbound instanceof DBInbound ? dbInbound : new DBInbound(dbInbound);
            let inbound;
            try {
                inbound = db.toInbound();
            } catch (e) {
                return null;
            }
            if (!inbound) return null;
            const fields = [];
            const links = [];
            const files = [];
            const host = this.host(db);
            const settings = inbound.settings || {};
            // The page-wide const from common/page.html. This template is included
            // without a dot, so the base_path template variable is out of reach here.
            const base = typeof basePath === 'string' ? basePath : '/';

            fields.push({ label: '{{ i18n "pages.credentials.server" }}', value: host, mono: true });

            switch (db.protocol) {
                case Protocols.OPENVPN:
                    fields.push({ label: '{{ i18n "username" }}', value: client.id, mono: true });
                    fields.push({ label: '{{ i18n "password" }}', value: client.password, mono: true });
                    fields.push({ label: '{{ i18n "pages.credentials.port" }}',
                        value: this.ovpnPorts(db, settings), mono: true });
                    // The .ovpn carries the CA and the server address; the username and
                    // password above are what the client is then prompted for. Both are
                    // needed, which is why they sit in the same block.
                    if (settings.udpEnable !== false) {
                        files.push({ label: 'client-udp.ovpn',
                            filename: 'client-udp.ovpn',
                            url: base + 'panel/api/inbounds/' + db.id + '/ovpn/udp' });
                    }
                    if (settings.tcpEnable !== false) {
                        files.push({ label: 'client-tcp.ovpn',
                            filename: 'client-tcp.ovpn',
                            url: base + 'panel/api/inbounds/' + db.id + '/ovpn/tcp' });
                    }
                    // The panel can serve an OpenVPN inbound's accounts over
                    // L2TP/IPsec as well. When it does, the SAME username and
                    // password work there — and the customer additionally needs the
                    // PSK, which lives on the inbound and so is invisible from the
                    // account. That is exactly the thing that had to be looked up by
                    // hand before.
                    if (settings.l2tpEnable) {
                        fields.push({ label: '{{ i18n "pages.credentials.alsoL2tp" }}',
                            value: '{{ i18n "pages.credentials.alsoL2tpValue" }}' });
                        fields.push({ label: '{{ i18n "pages.credentials.ipsecPsk" }}',
                            value: settings.ipsecPsk || '—', mono: true });
                    }
                    break;

                case Protocols.L2TP:
                case Protocols.PPTP:
                case Protocols.SSTP:
                case Protocols.OPENCONNECT:
                case Protocols.IKEV2:
                    fields.push({ label: '{{ i18n "username" }}', value: client.id || client.email, mono: true });
                    fields.push({ label: '{{ i18n "password" }}', value: client.password, mono: true });
                    fields.push({ label: '{{ i18n "pages.credentials.port" }}',
                        value: String(db.port), mono: true });
                    if (settings.ipsecPsk) {
                        fields.push({ label: '{{ i18n "pages.credentials.ipsecPsk" }}',
                            value: settings.ipsecPsk, mono: true });
                    }
                    break;

                // Key-based tunnels: the credential is a generated .conf, not anything
                // a person can retype, so the row points at the config viewer rather
                // than pretending there is a username to hand over.
                case Protocols.WGC:
                case Protocols.AWG:
                case Protocols.SSH:
                    fields.push({ label: '{{ i18n "pages.credentials.configFile" }}',
                        value: '{{ i18n "pages.credentials.configFileHint" }}' });
                    break;

                default: {
                    // Xray-side protocols: the share link IS the credential, so the
                    // uuid/password is not repeated as a field the customer would
                    // have to assemble by hand.
                    let generated = [];
                    try {
                        generated = inbound.genAllLinks(db.remark,
                            (typeof app !== 'undefined' && app.remarkModel) || '-ieo', client) || [];
                    } catch (e) {
                        generated = [];
                    }
                    generated.forEach((l, i) => {
                        if (!l || !l.link) return;
                        links.push({
                            label: l.remark || ('{{ i18n "pages.credentials.config" }}' + ' ' + (i + 1)),
                            value: l.link,
                        });
                    });
                    break;
                }
            }

            // The subscription belongs to every protocol that has one: it is the
            // link that keeps working when an operator moves a customer between
            // inbounds, so it is worth sending alongside the config rather than
            // instead of it.
            const sub = (typeof app !== 'undefined' && app.subSettings) || null;
            if (sub && sub.enable && client.subId) {
                links.push({ label: '{{ i18n "pages.credentials.subscription" }}',
                    value: sub.subURI + client.subId });
                if (sub.subJsonEnable && sub.subJsonURI) {
                    links.push({ label: '{{ i18n "pages.credentials.subscriptionJson" }}',
                        value: sub.subJsonURI + client.subId });
                }
            }

            return {
                key: db.id + ":" + client.email,
                email: client.email,
                protocol: db.protocol,
                inboundRemark: db.remark,
                fields,
                links,
                files,
            };
        },

        // Which port(s) the customer can actually reach OpenVPN on. TCP and UDP
        // share the inbound's port unless separatePorts gave TCP its own.
        ovpnPorts(dbInbound, settings) {
            const parts = [];
            if (settings.udpEnable !== false) parts.push(dbInbound.port + "/UDP");
            if (settings.tcpEnable !== false) {
                parts.push((settings.separatePorts ? settings.tcpPort : dbInbound.port) + "/TCP");
            }
            return parts.length ? parts.join("  ·  ") : String(dbInbound.port);
        },

        // One plain-text block, ready to paste into a chat. Deliberately not JSON or
        // a table: it is read by a person on a phone.
        asText() {
            const out = [];
            for (const acc of this.accounts) {
                out.push("== " + String(acc.protocol).toUpperCase() + " — " + acc.email + " ==");
                for (const f of acc.fields) out.push(f.label + ": " + f.value);
                for (const l of acc.links) out.push(l.label + ":\n" + l.value);
                out.push("");
            }
            return out.join("\n").trim();
        },

        copy(text) {
            ClipboardManager.copyText(text).then((ok) => {
                if (ok) Vue.prototype.$message.success('{{ i18n "copied" }}');
            });
        },
        copyAll() {
            this.copy(this.asText());
        },
        // A .txt beside the clipboard: an operator handing over several accounts at
        // once usually wants a file to attach, not a paste that scrolls off screen.
        download() {
            const name = this.accounts.length === 1
                ? this.accounts[0].email
                : 'accounts';
            const blob = new Blob([this.asText()], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = name.replace(/[^\w.-]+/g, '_') + '.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 0);
        },
        close() {
            credentialsModal.visible = false;
        },
    };

    const credentialsModalApp = new Vue({
        delimiters: ["[[", "]]"],
        el: "#client-credentials-modal",
        data: {
            credentialsModal,
            themeSwitcher,
            get isMobile() {
                return app.isMobile;
            },
        },
    });
</script>
{{end}}
